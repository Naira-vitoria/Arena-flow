<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<mat-sidenav-container class="estrutura">

  <mat-sidenav
    #menu
    class="menu-lateral"
    [mode]="(telaPequena$ | async) ? 'over' : 'side'"
    [opened]="!(telaPequena$ | async)"
    aria-label="Menu principal">

    <div class="marca">
      <mat-icon class="logo-trofeu">emoji_events</mat-icon>

      <h2>Arena <span>Flow</span></h2>
      <small>Gestão de Campeonatos</small>
    </div>

    <nav class="navegacao">
      <a mat-list-item
         routerLink="/inicio"
         routerLinkActive="item-ativo"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="menu.mode === 'over' && menu.close()">
        <mat-icon>home</mat-icon>
        <span>Início</span>
      </a>

      <a mat-list-item
         routerLink="/projetos"
         routerLinkActive="item-ativo"
         (click)="menu.mode === 'over' && menu.close()">
        <mat-icon>emoji_events</mat-icon>
        <span>Campeonatos</span>
      </a>

      <a mat-list-item
         routerLink="/equipes"
         routerLinkActive="item-ativo"
         (click)="menu.mode === 'over' && menu.close()">
        <mat-icon>groups</mat-icon>
        <span>Equipes</span>
      </a>

      <a mat-list-item
         routerLink="/partidas"
         routerLinkActive="active">
        <mat-icon>sports_soccer</mat-icon>
        <span>Partidas</span>
      </a>

    
    </nav>

  </mat-sidenav>

  <mat-sidenav-content class="area-principal">

    <mat-toolbar class="topo">

      <button
        mat-icon-button
        type="button"
        (click)="menu.toggle()"
        aria-label="Abrir ou fechar menu">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="nome-topo">Arena Flow</span>

      <span class="espacador"></span>

      <div class="usuario">
        <div class="avatar">AD</div>

        <div class="usuario-info">
          <strong>{{ usuario }}</strong>
          <small>{{ funcao }}</small>
        </div>

        <mat-icon class="seta-usuario">expand_more</mat-icon>
      </div>

    </mat-toolbar>

    <main id="conteudo" class="conteudo" tabindex="-1">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>
</mat-sidenav-container>
